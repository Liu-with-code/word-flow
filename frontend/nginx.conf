server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ---- 压缩与缓存：多用户场景可显著降低带宽、加速加载 ----
    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   1k;
    gzip_vary         on;
    gzip_types        text/plain text/css application/json application/javascript application/xml application/wasm image/svg+xml;

    # 后端 API
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # Vite 产物（文件名带内容哈希，可长期缓存）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 图片等静态资源
    location ~* \.(png|jpe?g|gif|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 头像等上传文件（由后端磁盘提供）
    location /uploads/ {
        proxy_pass         http://backend:8080;
        proxy_set_header   Host $host;
    }

    # 客户端可上传头像（最大 5MB，后端另有 2MB 校验）
    client_max_body_size 5m;

    # 前端 SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
