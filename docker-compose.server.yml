# =====================================================================
# WordFlow 服务器部署编排（复用已有 MySQL 容器，适合单机/云服务器）
#
# 前置准备（按 DEPLOY-SERVER.md 执行一次）：
#   1. 创建网络：docker network create wordflow
#   2. 把已有 MySQL 容器接入并起别名：
#        docker network connect --alias mysql wordflow mysql-container
#   3. 在 mysql-container 中建库建用户并导入 database/schema.sql
#   4. 停掉官方默认 nginx（让 wordflow-frontend 接管 80 端口）：
#        docker stop nginx && docker rm nginx
#
# 启动：
#   docker compose -f docker-compose.server.yml up -d --build
#   docker compose -f docker-compose.server.yml --profile tools run --rm import
# =====================================================================

name: wordflow

services:
  backend:
    image: wordflow-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: wordflow-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/wordflow?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME:-wordflow}
      DB_PASSWORD: ${DB_PASSWORD:-wordflow}
      JWT_SECRET: ${JWT_SECRET:-wordflow-dev-secret-change-me-0123456789abcdef}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-168}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com}
      AI_MODEL: ${AI_MODEL:-deepseek-v4-flash}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-60}
      WORDFLOW_UPLOAD_DIR: /app/uploads
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
      TZ: Asia/Shanghai
    mem_limit: 384m
    volumes:
      - wordflow_uploads:/app/uploads
    ports:
      - "8080:8080"
    networks:
      - wordflow

  frontend:
    image: wordflow-frontend:latest
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: wordflow-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - wordflow

  # 一次性词书导入：docker compose -f docker-compose.server.yml --profile tools run --rm import
  import:
    image: wordflow-backend:latest
    profiles: ["tools"]
    command:
      - --spring.profiles.active=import
      - --wordflow.import-dir=/raw
    environment:
      DB_URL: jdbc:mysql://mysql:3306/wordflow?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME:-wordflow}
      DB_PASSWORD: ${DB_PASSWORD:-wordflow}
      TZ: Asia/Shanghai
    volumes:
      - ./database/raw:/raw:ro
    networks:
      - wordflow

networks:
  wordflow:
    external: true

volumes:
  wordflow_uploads:
