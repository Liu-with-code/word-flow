name: wordflow

# 说明：生产部署请复制 .env.example 为 .env 并修改其中的密钥/口令
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: wordflow
      MYSQL_USER: ${DB_USERNAME:-wordflow}
      MYSQL_PASSWORD: ${DB_PASSWORD:-wordflow}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      # 仅首次初始化（数据卷为空时）执行：建库建表 + 词书元数据
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    image: wordflow-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/wordflow?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME:-wordflow}
      DB_PASSWORD: ${DB_PASSWORD:-wordflow}
      JWT_SECRET: ${JWT_SECRET:-wordflow-dev-secret-change-me-0123456789abcdef}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-168}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com}
      AI_MODEL: ${AI_MODEL:-deepseek-v4-flash}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-60}
      WORDFLOW_UPLOAD_DIR: /app/uploads
      TZ: Asia/Shanghai
    volumes:
      - uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    image: wordflow-frontend:latest
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"

  # 一次性词书导入（不会随 docker compose up 启动）
  # 用法：docker compose --profile tools run --rm import
  import:
    image: wordflow-backend:latest
    profiles: ["tools"]
    command:
      - --spring.profiles.active=import
      - --wordflow.import-dir=/raw
    environment:
      DB_URL: jdbc:mysql://mysql:3306/wordflow?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME:-wordflow}
      DB_PASSWORD: ${DB_PASSWORD:-wordflow}
      TZ: Asia/Shanghai
    volumes:
      - ./database/raw:/raw:ro
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  uploads:
